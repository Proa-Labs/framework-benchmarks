# One-time cluster-admin installation. Only the trusted Actions runner may
# manage disposable benchmark jobs; PR runners receive no permissions here.
apiVersion: v1
kind: Namespace
metadata:
  name: framework-benchmarks
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: benchmark-controller
  namespace: framework-benchmarks
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: benchmark-controller
  namespace: framework-benchmarks
subjects:
  - kind: ServiceAccount
    name: runner
    namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: benchmark-controller
