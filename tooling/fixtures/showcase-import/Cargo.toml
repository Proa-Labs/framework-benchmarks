[package]
name = "proa-showcase-fixture-export"
version = "0.0.0"
edition = "2024"
publish = false

# Fixture provenance tool, not a timed renderer. Keep its upstream source exact.
[dependencies]
proa_core = {git="https://github.com/Proa-Labs/proa", rev="ceffd9f305acabbb0584fa181df4f4e2d7883e94"}
proa_demo = {git="https://github.com/Proa-Labs/proa", rev="ceffd9f305acabbb0584fa181df4f4e2d7883e94"}
proa_showcase = {git="https://github.com/Proa-Labs/proa", rev="ceffd9f305acabbb0584fa181df4f4e2d7883e94", default-features=false, features=["rsjs-pages"]}
serde = {version="1",features=["derive"]}
serde_json = "1"
sha2 = "0.11"

[profile.release]
opt-level=3
debug-assertions=false

[workspace]
