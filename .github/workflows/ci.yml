name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-ci-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  SCCACHE_IDLE_TIMEOUT: "0"

jobs:
  checks:
    name: ${{ matrix.name }}
    # PR build scripts and browser tooling run on disposable GitHub-hosted VMs,
    # without depending on the availability of the self-hosted PR runner pool.
    # Trusted events continue to use the configured GCP runner.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || vars.CI_RUNNER }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: quality
            name: Code and repository quality
            timeout: 15
          - suite: rendering
            name: Rendering builds and framework parity
            timeout: 60
    steps:
      - name: Checkout tested benchmark revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Lint workflows and embedded shell
        if: matrix.suite == 'quality'
        uses: ./.github/actions/workflow-lint

      - name: Set up Cloudflare local tooling host
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.0"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Set up Python
        if: matrix.suite == 'quality' || matrix.suite == 'rendering'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Go
        if: matrix.suite == 'rendering'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.5"
          cache: false

      - name: Set up Java
        if: matrix.suite == 'rendering'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: matrix.suite == 'rendering'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: "9.2.0"

      - name: Set up PHP
        if: matrix.suite == 'rendering'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"

      - name: Prepare Ruby tool cache
        if: matrix.suite == 'rendering'
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/hostedtoolcache

      - name: Set up Ruby
        if: matrix.suite == 'rendering'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
          working-directory: rendering/external/rails

      - name: Install Python test dependencies
        if: matrix.suite == 'quality'
        run: python -m pip install --disable-pip-version-check "playwright==1.58.0"

      - name: Validate browser and research tooling
        if: matrix.suite == 'quality'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run test
          npm --prefix rendering/external/sveltekit ci
          bun test rendering/external/sveltekit/stream-validator.test.mjs sveltekit/benchmark.test.mjs
          bun sveltekit/report.mjs --check
          bash -n scripts/refresh-proa.sh rendering/run_all.sh framework-ssr/cloud/*.sh tooling/cloud/*.sh

      - name: Check Rust formatting
        if: matrix.suite == 'quality'
        run: cargo fmt --all -- --check

      - name: Configure read-only Proa access
        if: matrix.suite == 'rendering'
        env:
          PROA_FRAMEWORK_TOKEN: ${{ secrets.PROA_FRAMEWORK_TOKEN }}
        run: |
          set -euo pipefail
          # Fork PRs do not receive repository secrets. Proa is public, so
          # anonymous fetches must work too; retain optional authenticated access.
          if [[ -n "${PROA_FRAMEWORK_TOKEN:-}" ]]; then
            git config --global \
              url."https://x-access-token:${PROA_FRAMEWORK_TOKEN}@github.com/Proa-Labs/proa".insteadOf \
              "https://github.com/Proa-Labs/proa"
          fi

      - name: Fetch pinned benchmark dependencies
        if: matrix.suite == 'rendering'
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path fixtures/airbnb-parity-dump/Cargo.toml

      - name: Configure compiler cache
        if: matrix.suite == 'rendering'
        uses: ./.github/actions/rust-cache
        with:
          cache-backend: ${{ github.event_name == 'pull_request' && 'gha' || startsWith(vars.CI_RUNNER, 'gcp') && 'gcs' || 'gha' }}

      - name: Install browser parity dependencies
        if: matrix.suite == 'rendering'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun install --cwd rendering/external/react --frozen-lockfile
          bun install --cwd rendering/external/marko --frozen-lockfile
          bun install --cwd rendering/external/vue --frozen-lockfile
          bun install --cwd rendering/external/svelte --frozen-lockfile
          npm --prefix rendering/external/sveltekit ci
          bun node_modules/playwright/cli.js install --with-deps chromium

      - name: Run Clippy correctness lints
        if: matrix.suite == 'rendering'
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features --locked -- \
            -A clippy::all -D clippy::correctness

      - name: Test Rust comparison fixtures
        if: matrix.suite == 'rendering'
        run: cargo test --workspace --all-features --locked

      - name: Link every Rust benchmark target
        if: matrix.suite == 'rendering'
        run: cargo bench --workspace --all-features --locked --no-run

      - name: Check linked Airbnb fixture
        if: matrix.suite == 'rendering'
        run: |
          set -euo pipefail
          cargo check \
            --manifest-path fixtures/airbnb-parity-dump/Cargo.toml \
            --locked

      - name: Compare normalized browser DOM
        if: matrix.suite == 'rendering'
        run: bun rendering/standard_page_parity.mjs

      - name: Validate canonical framework matrix
        if: matrix.suite == 'rendering'
        run: |
          ./rendering/run-all --smoke
          ./rendering/run-all --product-scaling --smoke --no-setup

      - name: Validate Suspense streaming fixtures
        if: matrix.suite == 'rendering'
        run: |
          bun run bench:suspense-load:smoke
          bun sveltekit/run.mjs --smoke

      - name: Validate canonical page servers
        if: matrix.suite == 'rendering'
        # The smoke proves every production server starts, passes parity and
        # survives both phase kinds. It is not a measurement: the PR runner's
        # two generator workers cannot out-generate Proa's component page, so
        # a generator-limited phase is recorded rather than fatal here.
        run: |
          bun page-load/run.mjs --duration 1 --repeats 1 --warmup-requests 4 --concurrency 8 \
            --tolerate-generator-limits --out page-load/results/smoke.json
          bun run bench:cold-start:smoke

      - name: Build and gate all full-framework SSR workloads
        if: matrix.suite == 'rendering'
        run: |
          bun install --cwd framework-ssr --frozen-lockfile
          bun framework-ssr/build.ts
          bun framework-ssr/run.ts --no-build --smoke --workers 2

      - name: Verify unchanged-fixture exclusion evidence
        if: matrix.suite == 'rendering'
        run: |
          bun rendering/external/exact/check-admission.mjs

      - name: Show compiler cache stats
        if: always() && matrix.suite == 'rendering'
        run: sccache --show-stats

  ci:
    name: lint, clippy, build, test
    # Do not create a final runner-dependent job after the workflow itself was
    # canceled; otherwise an unavailable pool can retain the concurrency lock.
    if: ${{ always() && !cancelled() }}
    needs: [checks]
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || vars.CI_RUNNER }}
    timeout-minutes: 2
    steps:
      - name: Require every merge prerequisite
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          set -euo pipefail
          case "$CHECKS_RESULT" in
            success) ;;
            *)
              echo "required CI dependency finished with result: $CHECKS_RESULT" >&2
              exit 1
              ;;
          esac
