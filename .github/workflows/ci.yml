name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-ci-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

# Every event runs on disposable GitHub-hosted VMs (free for this public
# repository). Main therefore saves the same caches that pull requests restore.
#
# Each suite runs as its own job so the slowest one, not their sum, sets the
# wall-clock time. Pull requests run only the suites their files can affect
# (.github/scripts/affected-suites.sh); main and manual runs run everything.
# The two final jobs keep the branch ruleset's required check names.
jobs:
  changes:
    name: Select affected suites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      rendering: ${{ steps.select.outputs.rendering }}
      streaming: ${{ steps.select.outputs.streaming }}
      http: ${{ steps.select.outputs.http }}
      framework: ${{ steps.select.outputs.framework }}
      framework-workloads: ${{ steps.workloads.outputs.framework }}
    steps:
      - name: Checkout suite selection rules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/
            benchmarks/framework-ssr/contract.json
      - name: Select suites affected by this change
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: .github/scripts/affected-suites.sh
      - name: List full-framework workloads
        id: workloads
        run: echo "framework=$(jq -c '[.workloads[].id]' benchmarks/framework-ssr/contract.json)" >> "$GITHUB_OUTPUT"

  quality:
    name: Code and repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout tested benchmark revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Lint workflows and embedded shell
        uses: ./.github/actions/workflow-lint
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check "playwright==1.58.0"
      - name: Validate browser and research tooling
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun tooling/maintenance/prune-results.mjs --check
          bun run test
          bun test benchmarks/rendering/external/sveltekit/stream-validator.test.mjs experiments/sveltekit-streaming/benchmark.test.mjs
          bun experiments/sveltekit-streaming/report.mjs --check
          bash -n tooling/maintenance/refresh-proa.sh benchmarks/rendering/run_all.sh benchmarks/framework-ssr/cloud/*.sh tooling/cloud/*.sh .github/scripts/*.sh
      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Rust correctness lints
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tested benchmark revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      # proa_bench's build script generates its showcase fixtures with the
      # workspace's pinned Bun and its packages.
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: clippy
          workspaces: |
            . -> target
            fixtures/airbnb-parity-dump -> target
          proa-token: ${{ secrets.PROA_FRAMEWORK_TOKEN }}
      - name: Run Clippy correctness lints
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- \
            -A clippy::all -D clippy::correctness
      - name: Check linked Airbnb fixture
        run: cargo check --manifest-path fixtures/airbnb-parity-dump/Cargo.toml --locked
      - name: Save the workspace crates
        uses: ./.github/actions/save-rust
        with:
          key: ${{ steps.rust.outputs.artifact-key }}
          paths: ${{ steps.rust.outputs.artifact-paths }}
          hit: ${{ steps.rust.outputs.artifact-hit }}

  test:
    name: Rust comparison fixtures
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tested benchmark revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      # proa_bench's build script generates its showcase fixtures with the
      # workspace's pinned Bun and its packages.
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: test
          proa-token: ${{ secrets.PROA_FRAMEWORK_TOKEN }}
      - name: Test Rust comparison fixtures
        run: cargo test --workspace --all-features --locked
      - name: Save the workspace crates
        uses: ./.github/actions/save-rust
        with:
          key: ${{ steps.rust.outputs.artifact-key }}
          paths: ${{ steps.rust.outputs.artifact-paths }}
          hit: ${{ steps.rust.outputs.artifact-hit }}

  bench:
    name: Rust benchmark targets
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tested benchmark revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      # proa_bench's build script generates its showcase fixtures with the
      # workspace's pinned Bun and its packages.
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: bench
          proa-token: ${{ secrets.PROA_FRAMEWORK_TOKEN }}
      - name: Link every Rust benchmark target
        run: cargo bench --workspace --all-features --locked --no-run
      - name: Save the workspace crates
        uses: ./.github/actions/save-rust
        with:
          key: ${{ steps.rust.outputs.artifact-key }}
          paths: ${{ steps.rust.outputs.artifact-paths }}
          hit: ${{ steps.rust.outputs.artifact-hit }}

  dom-parity:
    name: Standard page DOM parity
    needs: changes
    if: needs.changes.outputs.rendering == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout tested benchmark revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      # proa_bench's build script generates its showcase fixtures with the
      # workspace's pinned Bun and its packages.
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: release-default
          proa-token: ${{ secrets.PROA_FRAMEWORK_TOKEN }}
      - name: Start the release build
        run: |
          .github/scripts/background.sh start rust \
            cargo build --release --locked -p proa_bench --bin standard_page_dump
      - name: Install Chromium
        run: bun node_modules/playwright/cli.js install --with-deps chromium
      - name: Finish the release build
        run: .github/scripts/background.sh wait rust
      - name: Compare normalized browser DOM
        run: bun benchmarks/rendering/standard_page_parity.mjs
      - name: Save the workspace crates
        uses: ./.github/actions/save-rust
        with:
          key: ${{ steps.rust.outputs.artifact-key }}
          paths: ${{ steps.rust.outputs.artifact-paths }}
          hit: ${{ steps.rust.outputs.artifact-hit }}

  # The matrix shards by toolchain. Every shard includes Proa, the parity
  # reference, so each renderer is still compared against the same canonical
  # DOM; the shard filter assigns every roster entry to exactly one shard.
  canonical:
    name: Canonical framework matrix (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.rendering == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [native, jvm-ruby, javascript, frameworks]
    steps:
      - name: Checkout tested benchmark revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select this shard's renderers
        id: shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # native: compiled templates and scripting runtimes; jvm-ruby: Rails,
          # jte and Rocker; javascript: unbuilt Bun adapters; frameworks: every
          # other adapter, including any newly added setup.
          renderers="$(jq -r --arg shard "$SHARD" \
            --slurpfile adapters benchmarks/rendering/canonical/adapters.json '
              def group:
                if (.setup | IN("rust", "go", "php", "jinja2")) then "native"
                elif (.setup | IN("rails", "jte", "rocker")) then "jvm-ruby"
                elif .setup == "bun" and (has("build") | not) then "javascript"
                else "frameworks" end;
              ["proa"] + [.renderers[].id | select(. != "proa")
                | select($adapters[0][.] | group == $shard)]
              | join(",")' benchmarks/rendering/canonical/roster.json)"
          echo "renderers=$renderers" >> "$GITHUB_OUTPUT"
          echo "Renderers: $renderers"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      # proa_bench's build script generates its showcase fixtures with the
      # workspace's pinned Bun and its packages.
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: release-topcoat
          proa-token: ${{ secrets.PROA_FRAMEWORK_TOKEN }}
      - name: Start the release build
        run: |
          .github/scripts/background.sh start rust \
            cargo build --locked --release -p proa_bench --features topcoat --bin representative_suite_bench
      # These may install from apt; finish them before the browser's apt step.
      - name: Install native RSS supervisor
        run: |
          if [[ ! -x /usr/bin/time ]]; then
            sudo apt-get update
            sudo apt-get install -y time
          fi
      - name: Set up PHP
        if: matrix.shard == 'native'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
      - name: Start the Chromium install
        run: .github/scripts/background.sh start chromium bun node_modules/playwright/cli.js install --with-deps chromium
      - name: Set up Node.js
        if: matrix.shard == 'frameworks'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.0"
      - name: Set up Python
        if: matrix.shard == 'native'
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Restore the Jinja environment
        if: matrix.shard == 'native'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: benchmarks/rendering/external/jinja/.venv
          key: jinja-venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('benchmarks/rendering/external/jinja/requirements.txt') }}
      - name: Set up Go
        if: matrix.shard == 'native'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.5"
          cache: false
      - name: Set up Java
        if: matrix.shard == 'jvm-ruby'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        if: matrix.shard == 'jvm-ruby'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: "9.2.0"
      - name: Set up Ruby
        if: matrix.shard == 'jvm-ruby'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
          working-directory: benchmarks/rendering/external/rails
      - name: Restore the pinned Exact checkout and compiler
        if: matrix.shard == 'frameworks'
        uses: ./.github/actions/exact-cache
      - name: Finish the release build
        run: .github/scripts/background.sh wait rust
      - name: Build this shard's adapters
        env:
          RENDERERS: ${{ steps.shard.outputs.renderers }}
        run: ./benchmarks/rendering/run-all --setup-only --renderers "$RENDERERS"
      - name: Finish the Chromium install
        run: .github/scripts/background.sh wait chromium
      - name: Validate canonical framework matrix
        env:
          RENDERERS: ${{ steps.shard.outputs.renderers }}
        run: |
          ./benchmarks/rendering/run-all --smoke --no-setup --renderers "$RENDERERS"
          ./benchmarks/rendering/run-all --product-scaling --smoke --no-setup --renderers "$RENDERERS"
      - name: Verify unchanged-fixture exclusion evidence
        if: matrix.shard == 'frameworks'
        run: bun benchmarks/rendering/external/exact/check-admission.mjs
      - name: Save the workspace crates
        uses: ./.github/actions/save-rust
        with:
          key: ${{ steps.rust.outputs.artifact-key }}
          paths: ${{ steps.rust.outputs.artifact-paths }}
          hit: ${{ steps.rust.outputs.artifact-hit }}

  http:
    name: Canonical page servers and cold start
    needs: changes
    if: needs.changes.outputs.http == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tested benchmark revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bound loopback TIME_WAIT sockets
        uses: ./.github/actions/bound-time-wait
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      # proa_bench's build script generates its showcase fixtures with the
      # workspace's pinned Bun and its packages.
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: release-http
          proa-token: ${{ secrets.PROA_FRAMEWORK_TOKEN }}
      - name: Start the release build
        run: |
          .github/scripts/background.sh start rust \
            cargo build --release --locked -p proa_bench --features http-load,topcoat \
              --bin proa_page_server --bin representative_suite_bench
      - name: Start the Chromium install
        run: .github/scripts/background.sh start chromium bun node_modules/playwright/cli.js install --with-deps chromium
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.0"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.5"
          cache: false
      - name: Finish the release build
        run: .github/scripts/background.sh wait rust
      - name: Finish the Chromium install
        run: .github/scripts/background.sh wait chromium
      - name: Validate canonical page servers
        # The smoke proves every production server starts, passes parity and
        # survives both phase kinds. It is not a measurement: the runner's two
        # generator workers cannot out-generate Proa's component page, so a
        # generator-limited phase is recorded rather than fatal here.
        run: |
          bun benchmarks/http/run.mjs --duration 1 --repeats 1 --warmup-requests 4 --concurrency 8 \
            --tolerate-generator-limits --out benchmarks/http/results/smoke.json
      - name: Validate cold starts
        run: bun run bench:cold-start:smoke
      - name: Save the workspace crates
        uses: ./.github/actions/save-rust
        with:
          key: ${{ steps.rust.outputs.artifact-key }}
          paths: ${{ steps.rust.outputs.artifact-paths }}
          hit: ${{ steps.rust.outputs.artifact-hit }}

  streaming:
    name: Suspense streaming fixtures
    needs: changes
    if: needs.changes.outputs.streaming == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout tested benchmark revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bound loopback TIME_WAIT sockets
        uses: ./.github/actions/bound-time-wait
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      # proa_bench's build script generates its showcase fixtures with the
      # workspace's pinned Bun and its packages.
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: release-http
          artifact-key: release-http-suspense
          proa-token: ${{ secrets.PROA_FRAMEWORK_TOKEN }}
      - name: Start the release build
        run: |
          .github/scripts/background.sh start rust \
            cargo build --release --locked -p proa_bench --features http-load,topcoat --bin proa_suspense_server
      - name: Start the Chromium install
        run: .github/scripts/background.sh start chromium bun node_modules/playwright/cli.js install --with-deps chromium
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.0"
      - name: Finish the release build
        run: .github/scripts/background.sh wait rust
      - name: Finish the Chromium install
        run: .github/scripts/background.sh wait chromium
      - name: Validate Suspense streaming fixtures
        run: |
          bun run bench:suspense-load:smoke
          bun experiments/sveltekit-streaming/run.mjs --smoke
      - name: Save the workspace crates
        uses: ./.github/actions/save-rust
        with:
          key: ${{ steps.rust.outputs.artifact-key }}
          paths: ${{ steps.rust.outputs.artifact-paths }}
          hit: ${{ steps.rust.outputs.artifact-hit }}

  # One job per workload: every phase of the smoke is ~10 s (the largest
  # native pages need a full batch), so the complete contract ran ~14 min in
  # sequence. Shards use the runner's own --shard-workload selection.
  framework:
    name: Full-framework SSR (${{ matrix.workload }})
    needs: changes
    if: needs.changes.outputs.framework == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workload: ${{ fromJSON(needs.changes.outputs.framework-workloads) }}
    steps:
      - name: Checkout tested benchmark revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bound loopback TIME_WAIT sockets
        uses: ./.github/actions/bound-time-wait
      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: framework
          workspaces: benchmarks/framework-ssr/adapters/proa -> ../../../../target
          proa-token: ${{ secrets.PROA_FRAMEWORK_TOKEN }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.0"
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Restore the pinned Exact checkout and compiler
        uses: ./.github/actions/exact-cache
      - name: Build every full-framework adapter
        run: bun benchmarks/framework-ssr/build.ts
      - name: Gate this full-framework SSR workload
        env:
          WORKLOAD: ${{ matrix.workload }}
        run: bun benchmarks/framework-ssr/run.ts --no-build --smoke --workers 2 --shard-workload "$WORKLOAD"
      - name: Save the workspace crates
        uses: ./.github/actions/save-rust
        with:
          key: ${{ steps.rust.outputs.artifact-key }}
          paths: ${{ steps.rust.outputs.artifact-paths }}
          hit: ${{ steps.rust.outputs.artifact-hit }}

  # Required by the branch ruleset. A suite skipped because the change cannot
  # affect it counts as passing; every suite that ran must have succeeded.
  rendering:
    name: Rendering builds and framework parity
    # Do not create a final job after the workflow itself was canceled.
    if: ${{ always() && !cancelled() }}
    needs: [changes, clippy, test, bench, dom-parity, canonical, http, streaming, framework]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every rendering prerequisite
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e '.changes.result == "success"
            and all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null

  ci:
    name: lint, clippy, build, test
    if: ${{ always() && !cancelled() }}
    needs: [changes, quality, clippy, test, bench, dom-parity, canonical, http, streaming, framework]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every merge prerequisite
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e '.changes.result == "success" and .quality.result == "success"
            and all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null
