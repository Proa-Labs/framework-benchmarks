name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-ci-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

# Every event runs on disposable GitHub-hosted VMs (free for this public
# repository). Main therefore saves the same caches that pull requests restore.
#
# Each suite runs as its own job so the slowest one, not their sum, sets the
# wall-clock time. Pull requests run only the suites their files can affect
# (.github/scripts/affected-suites.sh); main and manual runs run everything.
# The final `required` job reports the branch ruleset's required check names.
jobs:
  changes:
    name: Select affected suites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      rendering: ${{ steps.select.outputs.rendering }}
      streaming: ${{ steps.select.outputs.streaming }}
      http: ${{ steps.select.outputs.http }}
      framework: ${{ steps.select.outputs.framework }}
      framework-workloads: ${{ steps.workloads.outputs.framework }}
      http-workloads: ${{ steps.workloads.outputs.http }}
      rendering-adapters: ${{ steps.adapters.outputs.matrix }}
    steps:
      - name: Checkout suite selection rules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/
            benchmarks/framework-ssr/contract.json
            benchmarks/http/scenario.mjs
      - name: Select suites affected by this change
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: .github/scripts/affected-suites.sh
      - name: Select changed rendering adapters
        if: github.event_name == 'pull_request'
        id: adapters
        run: node .github/scripts/changed-rendering-adapters.mjs
      - name: List the sharded suites' workloads
        id: workloads
        run: |
          set -euo pipefail
          echo "framework=$(jq -c '[.workloads[].id]' benchmarks/framework-ssr/contract.json)" >> "$GITHUB_OUTPUT"
          echo "http=$(node --input-type=module -e '
            const { WORKLOADS } = await import("./benchmarks/http/scenario.mjs");
            console.log(JSON.stringify(WORKLOADS.map(({ id }) => id)));
          ')" >> "$GITHUB_OUTPUT"

  quality:
    name: Code and repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout tested benchmark revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Lint workflows and embedded shell
        uses: ./.github/actions/workflow-lint
      - name: Set up the workspace
        uses: ./.github/actions/setup
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check "playwright==1.58.0"
      - name: Validate browser and research tooling
        run: |
          set -euo pipefail
          bun tooling/maintenance/prune-results.mjs --check
          bun run test
          bun test benchmarks/rendering/external/sveltekit/stream-validator.test.mjs experiments/sveltekit-streaming/benchmark.test.mjs
          bun experiments/sveltekit-streaming/report.mjs --check
          bash -n tooling/maintenance/refresh-proa.sh benchmarks/rendering/run_all.sh benchmarks/framework-ssr/cloud/*.sh tooling/cloud/*.sh .github/scripts/*.sh
      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  rust:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rust correctness lints
            family: clippy
            # The Airbnb fixture is its own workspace beside the root one.
            workspaces: |
              . -> target
              fixtures/airbnb-parity-dump -> target
            run: |
              cargo clippy --workspace --all-targets --all-features --locked -- -A clippy::all -D clippy::correctness
              cargo check --manifest-path fixtures/airbnb-parity-dump/Cargo.toml --locked
          - name: Rust comparison fixtures
            family: test
            run: cargo test --workspace --all-features --locked
          - name: Rust benchmark targets
            family: bench
            run: cargo bench --workspace --all-features --locked --no-run
    steps:
      - name: Checkout tested benchmark revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          rust: ${{ matrix.family }}
          rust-workspaces: ${{ matrix.workspaces || '. -> target' }}
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
      - name: Save the workspace crates
        uses: ./.github/actions/save-rust

  dom-parity:
    name: Standard page DOM parity
    needs: changes
    if: needs.changes.outputs.rendering == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout tested benchmark revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          rust: release-default
          chromium: true
      - name: Finish the Chromium install
        run: .github/scripts/background.sh wait chromium
      - name: Compare normalized browser DOM
        run: bun benchmarks/rendering/standard_page_parity.mjs
      - name: Save the workspace crates
        uses: ./.github/actions/save-rust

  rendering-adapter:
    name: Rendering adapter smoke (${{ matrix.adapter.id }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rendering-adapters != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        adapter: ${{ fromJSON(needs.changes.outputs.rendering-adapters) }}
    steps:
      - name: Checkout tested benchmark revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up PHP
        if: matrix.adapter.setup == 'php'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          chromium: true
          node: true
      - name: Set up Python
        if: matrix.adapter.setup == 'jinja2'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Set up Go
        if: matrix.adapter.setup == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.5"
          cache: false
      - name: Set up Java
        if: matrix.adapter.setup == 'jte' || matrix.adapter.setup == 'rocker'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        if: matrix.adapter.setup == 'jte' || matrix.adapter.setup == 'rocker'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: "9.2.0"
          cache-disabled: true
      - name: Set up Ruby
        if: matrix.adapter.setup == 'rails'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "4.0.6"
      - name: Finish the Chromium install
        run: .github/scripts/background.sh wait chromium
      - name: Validate the component page and capture a short diagnostic
        id: check
        env:
          ADAPTER: ${{ matrix.adapter.id }}
        run: bun run bench check-adapter "$ADAPTER" --smoke --out benchmarks/rendering/results/local/contributor-smoke.json
      - name: Summarize the focused check
        if: always()
        env:
          ADAPTER: ${{ matrix.adapter.id }}
          RESULT: ${{ steps.check.outcome }}
        run: |
          {
            printf "### Rendering adapter \`%s\`\n\n" "$ADAPTER"
            printf -- '- Component page parity and timed smoke: **%s**.\n' "$RESULT"
            printf -- "- Reproduce with \`bun run bench check-adapter %s --smoke\`.\n" "$ADAPTER"
            printf -- '- Diagnostic only. Public rankings require a validated publication capture.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain diagnostic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rendering-smoke-${{ matrix.adapter.id }}-attempt-${{ github.run_attempt }}
          path: benchmarks/rendering/results/local/contributor-smoke.json
          if-no-files-found: error
          retention-days: 7

  # The matrix shards by toolchain. Every shard includes Proa, the parity
  # reference, so each renderer is still compared against the same canonical
  # DOM; the shard filter assigns every roster entry to exactly one shard.
  canonical:
    name: Canonical framework matrix (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.rendering == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [native, jvm, ruby, javascript, frameworks]
    steps:
      - name: Checkout tested benchmark revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # It may install from apt; finish it before the browser's apt step.
      - name: Set up PHP
        if: matrix.shard == 'native'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
      - name: Select this shard's renderers
        id: shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # native: compiled templates and scripting runtimes; jvm: jte and
          # Rocker; ruby: Rails; javascript: unbuilt Bun adapters; frameworks:
          # every other adapter, including any newly added setup.
          renderers="$(jq -r --arg shard "$SHARD" \
            --slurpfile adapters benchmarks/rendering/canonical/adapters.json '
              def group:
                if (.setup | IN("rust", "go", "php", "jinja2")) then "native"
                elif (.setup | IN("jte", "rocker")) then "jvm"
                elif .setup == "rails" then "ruby"
                elif .setup == "bun" and (has("build") | not) then "javascript"
                else "frameworks" end;
              ["proa"] + [.renderers[].id | select(. != "proa")
                | select($adapters[0][.] | group == $shard)]
              | join(",")' benchmarks/rendering/canonical/roster.json)"
          echo "renderers=$renderers" >> "$GITHUB_OUTPUT"
          echo "Renderers: $renderers"
      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          chromium: true
          node: ${{ matrix.shard == 'frameworks' }}
          rust: release-topcoat
      - name: Start the release build
        run: |
          .github/scripts/background.sh start rust \
            cargo build --locked --release -p proa_bench --features topcoat --bin representative_suite_bench
      - name: Set up Python
        if: matrix.shard == 'native'
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Restore the Jinja environment
        if: matrix.shard == 'native'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: benchmarks/rendering/external/jinja/.venv
          key: jinja-venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('benchmarks/rendering/external/jinja/requirements.txt') }}
      - name: Set up Go
        if: matrix.shard == 'native'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.5"
          cache: false
      - name: Set up Java
        if: matrix.shard == 'jvm'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        if: matrix.shard == 'jvm'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: "9.2.0"
      - name: Set up Ruby
        if: matrix.shard == 'ruby'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
          working-directory: benchmarks/rendering/external/rails
      - name: Restore the pinned Exact checkout and compiler
        if: matrix.shard == 'frameworks'
        uses: ./.github/actions/exact-cache
      - name: Finish the release build
        run: .github/scripts/background.sh wait rust
      - name: Build this shard's adapters
        env:
          RENDERERS: ${{ steps.shard.outputs.renderers }}
        run: ./benchmarks/rendering/run-all --setup-only --renderers "$RENDERERS"
      - name: Finish the Chromium install
        run: .github/scripts/background.sh wait chromium
      - name: Validate canonical framework matrix
        env:
          RENDERERS: ${{ steps.shard.outputs.renderers }}
        run: |
          ./benchmarks/rendering/run-all --smoke --no-setup --renderers "$RENDERERS"
          ./benchmarks/rendering/run-all --product-scaling --smoke --no-setup --renderers "$RENDERERS"
      - name: Verify unchanged-fixture exclusion evidence
        if: matrix.shard == 'frameworks'
        run: bun benchmarks/rendering/external/exact/check-admission.mjs
      - name: Save the workspace crates
        uses: ./.github/actions/save-rust

  # One job per page-load workload; the first also runs the cold-start smoke,
  # which reuses that job's adapter builds.
  http:
    name: Canonical page servers (${{ matrix.workload }})
    needs: changes
    if: needs.changes.outputs.http == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workload: ${{ fromJSON(needs.changes.outputs.http-workloads) }}
    steps:
      - name: Checkout tested benchmark revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bound loopback TIME_WAIT sockets
        uses: ./.github/actions/bound-time-wait
      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          chromium: true
          node: true
          rust: release-http
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.5"
          cache: false
      - name: Build the release servers
        run: |
          cargo build --release --locked -p proa_bench --features http-load,topcoat \
            --bin proa_page_server --bin representative_suite_bench
      - name: Finish the Chromium install
        run: .github/scripts/background.sh wait chromium
      - name: Validate canonical page servers
        # The smoke proves every production server starts, passes parity and
        # survives both phase kinds. It is not a measurement: the runner's two
        # generator workers cannot out-generate Proa's component page, so a
        # generator-limited phase is recorded rather than fatal here.
        env:
          WORKLOAD: ${{ matrix.workload }}
        run: |
          bun benchmarks/http/run.mjs --duration 1 --repeats 1 --warmup-requests 4 --concurrency 8 \
            --tolerate-generator-limits --workloads "$WORKLOAD" --out benchmarks/http/results/smoke.json
      - name: Validate cold starts
        if: matrix.workload == fromJSON(needs.changes.outputs.http-workloads)[0]
        run: bun run bench:cold-start:smoke
      - name: Save the workspace crates
        uses: ./.github/actions/save-rust

  streaming:
    name: Suspense streaming fixtures
    needs: changes
    if: needs.changes.outputs.streaming == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout tested benchmark revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bound loopback TIME_WAIT sockets
        uses: ./.github/actions/bound-time-wait
      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          chromium: true
          node: true
          rust: release-http
          rust-artifacts: release-http-suspense
      - name: Build the release server
        run: cargo build --release --locked -p proa_bench --features http-load,topcoat --bin proa_suspense_server
      - name: Finish the Chromium install
        run: .github/scripts/background.sh wait chromium
      - name: Validate Suspense streaming fixtures
        run: |
          bun run bench:suspense-load:smoke
          bun experiments/sveltekit-streaming/run.mjs --smoke
      - name: Save the workspace crates
        uses: ./.github/actions/save-rust

  # One job per workload: every phase of the smoke is ~10 s (the largest
  # native pages need a full batch), so the complete contract ran ~14 min in
  # sequence. Shards use the runner's own --shard-workload selection.
  framework:
    name: Full-framework SSR (${{ matrix.workload }})
    needs: changes
    if: needs.changes.outputs.framework == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workload: ${{ fromJSON(needs.changes.outputs.framework-workloads) }}
    env:
      WORKLOAD: ${{ matrix.workload }}
    steps:
      - name: Checkout tested benchmark revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bound loopback TIME_WAIT sockets
        uses: ./.github/actions/bound-time-wait
      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          node: true
          rust: framework
          rust-workspaces: |
            benchmarks/framework-ssr/adapters/proa -> ../../../../target
            benchmarks/framework-ssr/adapters/leptos -> ../../../../target
      - name: Restore the pinned Exact checkout and compiler
        uses: ./.github/actions/exact-cache
      # proa_bench is the adapter's slow path dependency and needs none of the
      # fixtures build.ts writes first; compile it beside the JavaScript and
      # Exact builds. build.ts's own Cargo run then reuses it.
      - name: Start the release build
        run: |
          .github/scripts/background.sh start rust \
            cargo build --release --locked -p proa_bench --target-dir target \
              --manifest-path benchmarks/framework-ssr/adapters/proa/Cargo.toml
      - name: Build every full-framework adapter
        run: bun benchmarks/framework-ssr/build.ts
      - name: Finish the release build
        run: .github/scripts/background.sh wait rust
      - name: Gate this full-framework SSR workload
        run: bun benchmarks/framework-ssr/run.ts --no-build --smoke --workers 2 --shard-workload "$WORKLOAD"
      - name: Save the workspace crates
        uses: ./.github/actions/save-rust

  # The branch ruleset requires both check names; each covers every suite. A
  # suite skipped because the change cannot affect it counts as passing; every
  # suite that ran must have succeeded.
  required:
    name: ${{ matrix.check }}
    # Do not create a final job after the workflow itself was canceled.
    if: ${{ always() && !cancelled() }}
    needs: [changes, quality, rust, dom-parity, rendering-adapter, canonical, http, streaming, framework]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    strategy:
      matrix:
        check: [Rendering builds and framework parity, "lint, clippy, build, test"]
    steps:
      - name: Require every suite that ran to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null
