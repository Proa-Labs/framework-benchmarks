name: Set up pinned Rust
description: Install rust-toolchain.toml, enable Proa access and restore a target-directory cache

inputs:
  cache-key:
    description: >-
      Cache family. Jobs that compile the same profile and feature set share a
      key, so their dependency artifacts are built once and restored everywhere.
    required: true
  workspaces:
    description: Cargo workspaces and their target directories, as rust-cache expects
    default: ". -> target"
  proa-token:
    description: Optional read-only token for Proa-Labs/proa (fork PRs receive none)
    default: ""

runs:
  using: composite
  steps:
    - name: Configure read-only Proa access
      shell: bash
      env:
        PROA_FRAMEWORK_TOKEN: ${{ inputs.proa-token }}
      run: |
        set -euo pipefail
        # Proa is public, so anonymous fetches work too; keep authenticated
        # access when the repository secret is available.
        if [[ -n "${PROA_FRAMEWORK_TOKEN:-}" ]]; then
          git config --global \
            url."https://x-access-token:${PROA_FRAMEWORK_TOKEN}@github.com/Proa-Labs/proa".insteadOf \
            "https://github.com/Proa-Labs/proa"
        fi

    # Before the cache step: its key includes the active rustc version.
    - name: Install the pinned toolchain
      shell: bash
      run: |
        rustup toolchain install --no-self-update
        rustc --version

    # Dependencies only: workspace crates rebuild from the checked-out sources.
    # Pull requests restore main's entry; a pull request that changes a key
    # input (lockfile, toolchain, CI environment) saves its own for later pushes.
    - name: Restore compiled dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache-key }}
        workspaces: ${{ inputs.workspaces }}
