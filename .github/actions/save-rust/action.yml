name: Save the workspace crates' artifacts
description: >-
  Run as the last step of a job set up with a rust family, before rust-cache's
  post-job cleanup removes the workspace crates. Only main saves: pull requests
  restore main's artifacts, and one that changes a crate has new inputs, so a
  new key, on every push.

runs:
  using: composite
  steps:
    - name: Save the workspace crates for these inputs
      if: env.WORKSPACE_CRATES_RESTORED != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        key: ${{ env.WORKSPACE_CRATES_KEY }}
        path: ${{ env.WORKSPACE_CRATES_PATHS }}
