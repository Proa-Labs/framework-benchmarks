name: Configure Rust compiler cache
description: Enable GitHub Actions compiler caching on GitHub-hosted runners

runs:
  using: composite
  steps:
    - name: Install pinned sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.17.0

    - name: Enable GitHub Actions sccache
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_GHA_ENABLED=on"
        } >> "$GITHUB_ENV"
