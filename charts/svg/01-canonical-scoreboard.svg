<title id="ttl">Server-render latency relative to Proa — November 12, 2026 canonical capture</title>
<desc id="dsc">Renderer-only latency, excluding HTTP and hydration. Proa returns fresh owned RenderBuffer pages without String conversion; peers retain their owned String outputs. Each dot is the median of five process P50s on a logarithmic axis. All cells passed DOM parity. 17 renderers across three workloads as a multiple of Proa's P50. Proa — Component page: 1.36 µs, 1×; 1,000-row table: 330 µs, 1×; Product grid: 14 µs, 1×. Marko — Component page: 9.37 µs, 6.9×; 1,000-row table: 1.4 ms, 4.26×; Product grid: 110 µs, 8.26×. React — Component page: 84.2 µs, 62×; 1,000-row table: 9.17 ms, 27.9×; Product grid: 430 µs, 31.4×. Vue — Component page: 9.73 µs, 7.17×; 1,000-row table: 1.54 ms, 4.68×; Product grid: 95 µs, 6.93×. Svelte — Component page: 8.68 µs, 6.39×; 1,000-row table: 1.52 ms, 4.63×; Product grid: 92 µs, 6.76×. Rails — Component page: 76.5 µs, 56.3×; 1,000-row table: 8.75 ms, 26.6×; Product grid: 460 µs, 33.8×. jte — Component page: 21.3 µs, 15.7×; 1,000-row table: 6.79 ms, 20.6×; Product grid: 640 µs, 46.6×. Rocker — Component page: 35.4 µs, 26.1×; 1,000-row table: 9.48 ms, 28.8×; Product grid: 730 µs, 53.6×. Handlebars — Component page: 30 µs, 22.1×; 1,000-row table: 4.03 ms, 12.2×; Product grid: 240 µs, 17.8×. Go html/template — Component page: 141 µs, 103×; 1,000-row table: 14.1 ms, 43×; Product grid: 1.15 ms, 84.2×. Jinja2 — Component page: 106 µs, 78.4×; 1,000-row table: 19.6 ms, 59.4×; Product grid: 1.43 ms, 105×. PHP — Component page: 32.9 µs, 24.2×; 1,000-row table: 1.78 ms, 5.4×; Product grid: 97 µs, 7.1×. Askama — Component page: 1.22 µs, 0.9×; 1,000-row table: 730 µs, 2.21×; Product grid: 24 µs, 1.75×. Sailfish — Component page: 1.86 µs, 1.37×; 1,000-row table: 630 µs, 1.9×; Product grid: 23 µs, 1.71×. Leptos — Component page: 16.9 µs, 12.5×; 1,000-row table: 1.68 ms, 5.11×; Product grid: 250 µs, 18.6×. Dioxus — Component page: 164 µs, 121×; 1,000-row table: 3.4 ms, 10.3×; Product grid: 410 µs, 30.2×. Topcoat — Component page: 16.5 µs, 12.2×; 1,