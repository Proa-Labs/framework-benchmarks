<title id="ttl">Server-render latency relative to Proa — November 14, 2026 canonical capture</title>
<desc id="dsc">Renderer-only latency, excluding HTTP and hydration. Proa returns fresh owned RenderBuffer pages without String conversion; peers retain their owned String outputs. Each dot is the median of five process P50s on a logarithmic axis. Strict rows pass DOM parity; Exact uses an explicitly adapted content/style gate. 21 renderers across three workloads as a multiple of Proa's P50. Proa — Component page: 1 µs, 1×; 1,000-row table: 250 µs, 1×; Product grid: 13 µs, 1×. Marko — Component page: 11 µs, 9.42×; 1,000-row table: 1.45 ms, 5.72×; Product grid: 110 µs, 8.97×. React — Component page: 87 µs, 78.4×; 1,000-row table: 10.1 ms, 39.9×; Product grid: 470 µs, 36.9×. Vue — Component page: 10 µs, 8.83×; 1,000-row table: 1.62 ms, 6.42×; Product grid: 94 µs, 7.34×. Svelte — Component page: 9 µs, 8.38×; 1,000-row table: 1.58 ms, 6.24×; Product grid: 94 µs, 7.35×. Rails — Component page: 80 µs, 71.6×; 1,000-row table: 9.1 ms, 35.9×; Product grid: 480 µs, 37.9×. jte — Component page: 23 µs, 20.8×; 1,000-row table: 7.32 ms, 28.9×; Product grid: 640 µs, 49.9×. Rocker — Component page: 37 µs, 32.8×; 1,000-row table: 10.8 ms, 42.5×; Product grid: 790 µs, 62.1×. Handlebars — Component page: 26 µs, 23.5×; 1,000-row table: 4.16 ms, 16.4×; Product grid: 210 µs, 16.6×. Go html/template — Component page: 140 µs, 128×; 1,000-row table: 14.4 ms, 56.7×; Product grid: 1.17 ms, 91.6×. Jinja2 — Component page: 110 µs, 97.9×; 1,000-row table: 19.3 ms, 76.2×; Product grid: 1.48 ms, 116×. PHP — Component page: 34 µs, 30.4×; 1,000-row table: 1.84 ms, 7.26×; Product grid: 96 µs, 7.57×. Askama — Component page: 1 µs, 1.12×; 1,000-row table: 760 µs, 3×; Product grid: 24 µs, 1.91×. Sailfish — Component page: 2 µs, 1.73×; 1,000-row table: 630 µs, 2.48×; Product grid: 24 µs, 1.85×. Leptos — Component page: 19 µs, 16.7×; 1,000-row table: 1.79 ms, 7.08×; Product grid: 270 µs, 21.2×. Dioxus — Component page: 170 µs, 148×; 1,000-row table: 3.47 ms, 13.7×; Product grid: 440 µs, 34.2×. Topcoat — Component page: 16 µs, 14.7×; 1,000-row table: 1.48 ms, 5.83×; Product grid: 200 µs, 15.5×. Astro — Component page: 51 µs, 46×; 1,000-row table: 2.9 ms, 11.4×; Product grid: 290 µs, 22.8×. SvelteKit — Component page: 12 µs, 10.9×; 1,000-row table: 1.64 ms, 6.48×; Product grid: 91 µs, 7.17×. Next.js — Component page: 77 µs, 68.9×; 1,000-row table: 5.24 ms, 20.7×; Product grid: 430 µs, 33.9×. Exact† — Component page: 5.55 ms, 4977×; 1,000-row table: 151 ms, 597×; Product grid: 17.5 ms, 1372×.</desc>
