<title id="ttl">Server-render latency relative to Proa — November 13, 2026 canonical capture</title>
<desc id="dsc">Renderer-only latency, excluding HTTP and hydration. Proa returns fresh owned RenderBuffer pages without String conversion; peers retain their owned String outputs. Each dot is the median of five process P50s on a logarithmic axis. All cells passed DOM parity. 20 renderers across three workloads as a multiple of Proa's P50. Proa — Component page: 1.4 µs, 1×; 1,000-row table: 340 µs, 1×; Product grid: 14 µs, 1×. Marko — Component page: 9.54 µs, 6.81×; 1,000-row table: 1.49 ms, 4.43×; Product grid: 110 µs, 7.8×. React — Component page: 86.6 µs, 61.9×; 1,000-row table: 10.5 ms, 31.3×; Product grid: 440 µs, 31.8×. Vue — Component page: 9.51 µs, 6.8×; 1,000-row table: 1.65 ms, 4.9×; Product grid: 94 µs, 6.73×. Svelte — Component page: 9.02 µs, 6.44×; 1,000-row table: 1.57 ms, 4.66×; Product grid: 95 µs, 6.82×. Rails — Component page: 80.9 µs, 57.8×; 1,000-row table: 9.05 ms, 26.8×; Product grid: 470 µs, 33.8×. jte — Component page: 22.3 µs, 16×; 1,000-row table: 7.19 ms, 21.3×; Product grid: 660 µs, 47.4×. Rocker — Component page: 37.3 µs, 26.7×; 1,000-row table: 10.6 ms, 31.5×; Product grid: 830 µs, 59.7×. Handlebars — Component page: 26.6 µs, 19×; 1,000-row table: 4.29 ms, 12.7×; Product grid: 220 µs, 15.7×. Go html/template — Component page: 144 µs, 103×; 1,000-row table: 14.5 ms, 43×; Product grid: 1.16 ms, 83.4×. Jinja2 — Component page: 108 µs, 77.3×; 1,000-row table: 19.5 ms, 57.9×; Product grid: 1.46 ms, 105×. PHP — Component page: 33.9 µs, 24.2×; 1,000-row table: 1.83 ms, 5.42×; Product grid: 96 µs, 6.92×. Askama — Component page: 1.23 µs, 0.88×; 1,000-row table: 740 µs, 2.2×; Product grid: 24 µs, 1.75×. Sailfish — Component page: 1.89 µs, 1.35×; 1,000-row table: 640 µs, 1.88×; Product grid: 24 µs, 1.72×. Leptos — Component page: 17.4 µs, 12.4×; 1,000-row table: 1.72 ms, 5.11×; Product grid: 260 µs, 18.7×. Dioxus — Component page: 168 µs, 120×; 1,000-row table: 3.55 ms, 10.5×; Product grid: 430 µs, 30.7×. Topcoat — Component page: 17 µs, 12.1×; 1,