<title id="ttl">Server-render latency relative to Proa — November 13, 2026 canonical capture</title>
<desc id="dsc">Renderer-only latency, excluding HTTP and hydration. Proa returns fresh owned RenderBuffer pages without String conversion; peers retain their owned String outputs. Each dot is the median of five process P50s on a logarithmic axis. Strict rows pass DOM parity; Exact uses an explicitly adapted content/style gate. 21 renderers across three workloads as a multiple of Proa's P50. Proa — Component page: 1 µs, 1×; 1,000-row table: 340 µs, 1×; Product grid: 15 µs, 1×. Marko — Component page: 11 µs, 7.55×; 1,000-row table: 1.47 ms, 4.36×; Product grid: 110 µs, 7.81×. React — Component page: 86 µs, 61×; 1,000-row table: 9.76 ms, 28.9×; Product grid: 450 µs, 30.6×. Vue — Component page: 10 µs, 7.12×; 1,000-row table: 1.63 ms, 4.83×; Product grid: 97 µs, 6.59×. Svelte — Component page: 9 µs, 6.41×; 1,000-row table: 1.5 ms, 4.43×; Product grid: 96 µs, 6.54×. Rails — Component page: 79 µs, 55.9×; 1,000-row table: 9.26 ms, 27.5×; Product grid: 470 µs, 32.3×. jte — Component page: 22 µs, 15.7×; 1,000-row table: 7.17 ms, 21.3×; Product grid: 650 µs, 44.4×. Rocker — Component page: 37 µs, 26.4×; 1,000-row table: 10.4 ms, 30.7×; Product grid: 790 µs, 54.3×. Handlebars — Component page: 30 µs, 21.4×; 1,000-row table: 4.25 ms, 12.6×; Product grid: 220 µs, 15.1×. Go html/template — Component page: 150 µs, 103×; 1,000-row table: 14.6 ms, 43.4×; Product grid: 1.19 ms, 81×. Jinja2 — Component page: 110 µs, 78.4×; 1,000-row table: 19.9 ms, 59.1×; Product grid: 1.47 ms, 100×. PHP — Component page: 35 µs, 24.6×; 1,000-row table: 1.86 ms, 5.51×; Product grid: 100 µs, 7.05×. Askama — Component page: 1 µs, 0.9×; 1,000-row table: 750 µs, 2.21×; Product grid: 26 µs, 1.75×. Sailfish — Component page: 2 µs, 1.41×; 1,000-row table: 650 µs, 1.92×; Product grid: 25 µs, 1.7×. Leptos — Component page: 18 µs, 12.6×; 1,000-row table: 1.75 ms, 5.2×; Product grid: 270 µs, 18.2×. Dioxus — Component page: 170 µs, 121×; 1,000-row table: 3.59 ms, 10.6×; Product grid: 440 µs, 29.8×. Topcoat — Component page: 17 µs, 12.1×; 1,000-row table: 1.52 ms, 4.5×; Product grid: 200 µs, 13.6×. Astro — Component page: 52 µs, 36.7×; 1,000-row table: 3 ms, 8.88×; Product grid: 300 µs, 20.4×. SvelteKit — Component page: 12 µs, 8.59×; 1,000-row table: 1.64 ms, 4.87×; Product grid: 95 µs, 6.46×. Next.js — Component page: 78 µs, 55.2×; 1,000-row table: 5.3 ms, 15.7×; Product grid: 440 µs, 30.1×. Exact† — Component page: 5.75 ms, 4087×; 1,000-row table: 154 ms, 456×; Product grid: 18 ms, 1230×.</desc>
