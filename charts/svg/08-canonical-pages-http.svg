<title id="ttl">Proa, React, Marko, Go html/template and SvelteKit serving the canonical pages over HTTP on one core</title>
<desc id="dsc">One core per engine, uncompressed loopback HTTP/1.1. Medians of three fresh processes; CPU counts all server threads. Proa on the Component page: 89,865 responses per second, 0.011 ms CPU per response, 8.6 MiB peak RSS. React on the Component page: 6,408 responses per second, 0.163 ms CPU per response, 99.3 MiB peak RSS. Marko on the Component page: 31,089 responses per second, 0.034 ms CPU per response, 90.2 MiB peak RSS. Go html/template on the Component page: 5,347 responses per second, 0.187 ms CPU per response, 16.2 MiB peak RSS. SvelteKit on the Component page: 5,745 responses per second, 0.187 ms CPU per response, 117.2 MiB peak RSS. Proa on the Product grid: 16,128 responses per second, 0.066 ms CPU per response, 9.1 MiB peak RSS. React on the Product grid: 1,355 responses per second, 0.766 ms CPU per response, 113.6 MiB peak RSS. Marko on the Product grid: 4,172 responses per second, 0.244 ms CPU per response, 110.9 MiB peak RSS. Go html/template on the Product grid: 758 responses per second, 1.320 ms CPU per response, 15.4 MiB peak RSS. SvelteKit on the Product grid: 1,126 responses per second, 0.931 ms CPU per response, 303.6 MiB peak RSS. Proa on the 1,000-row table: 1,697 responses per second, 0.619 ms CPU per response, 10.6 MiB peak RSS. React on the 1,000-row table: 120 responses per second, 8.382 ms CPU per response, 151.2 MiB peak RSS. Marko on the 1,000-row table: 442 responses per second, 2.309 ms CPU per response, 121.8 MiB peak RSS. Go html/template on the 1,000-row table: 63 responses per second, 16.170 ms CPU per response, 16.9 MiB peak RSS. SvelteKit on the 1,000-row table: 178 responses per second, 5.803 ms CPU per response, 592.2 MiB peak RSS.</desc>
