<title id="ttl">Proa, React, Marko, Go html/template and SvelteKit serving the canonical pages over HTTP on one core</title>
<desc id="dsc">One core per engine, uncompressed loopback HTTP/1.1. Medians of three fresh processes; CPU counts all server threads. Proa on the Component page: 87,804 responses per second, 0.011 ms CPU per response, 8.6 MiB peak RSS. React on the Component page: 6,578 responses per second, 0.159 ms CPU per response, 100.4 MiB peak RSS. Marko on the Component page: 31,843 responses per second, 0.033 ms CPU per response, 88.3 MiB peak RSS. Go html/template on the Component page: 5,403 responses per second, 0.185 ms CPU per response, 16.3 MiB peak RSS. SvelteKit on the Component page: 6,082 responses per second, 0.178 ms CPU per response, 116.8 MiB peak RSS. Proa on the Product grid: 15,763 responses per second, 0.068 ms CPU per response, 9.3 MiB peak RSS. React on the Product grid: 1,324 responses per second, 0.778 ms CPU per response, 118.9 MiB peak RSS. Marko on the Product grid: 4,349 responses per second, 0.234 ms CPU per response, 112.3 MiB peak RSS. Go html/template on the Product grid: 754 responses per second, 1.326 ms CPU per response, 15.3 MiB peak RSS. SvelteKit on the Product grid: 1,134 responses per second, 0.926 ms CPU per response, 313.4 MiB peak RSS. Proa on the 1,000-row table: 1,437 responses per second, 0.723 ms CPU per response, 10.6 MiB peak RSS. React on the 1,000-row table: 125 responses per second, 8.005 ms CPU per response, 166.4 MiB peak RSS. Marko on the 1,000-row table: 440 responses per second, 2.317 ms CPU per response, 127.4 MiB peak RSS. Go html/template on the 1,000-row table: 63 responses per second, 16.268 ms CPU per response, 16.9 MiB peak RSS. SvelteKit on the 1,000-row table: 179 responses per second, 5.782 ms CPU per response, 639.1 MiB peak RSS.</desc>
