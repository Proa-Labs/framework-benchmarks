<title id="ttl">Proa, React, Marko, Go html/template and SvelteKit serving the canonical pages over HTTP on one core</title>
<desc id="dsc">One core per engine, uncompressed loopback HTTP/1.1. Medians of three fresh processes; CPU counts all server threads. Proa on the Component page: 86,885 responses per second, 0.012 ms CPU per response, 8.6 MiB peak RSS. React on the Component page: 6,427 responses per second, 0.162 ms CPU per response, 96.0 MiB peak RSS. Marko on the Component page: 31,467 responses per second, 0.034 ms CPU per response, 89.2 MiB peak RSS. Go html/template on the Component page: 5,386 responses per second, 0.186 ms CPU per response, 16.2 MiB peak RSS. SvelteKit on the Component page: 5,945 responses per second, 0.182 ms CPU per response, 111.2 MiB peak RSS. Proa on the Product grid: 15,517 responses per second, 0.069 ms CPU per response, 9.3 MiB peak RSS. React on the Product grid: 1,313 responses per second, 0.783 ms CPU per response, 122.1 MiB peak RSS. Marko on the Product grid: 4,326 responses per second, 0.236 ms CPU per response, 105.9 MiB peak RSS. Go html/template on the Product grid: 755 responses per second, 1.324 ms CPU per response, 15.7 MiB peak RSS. SvelteKit on the Product grid: 1,070 responses per second, 0.980 ms CPU per response, 296.4 MiB peak RSS. Proa on the 1,000-row table: 1,429 responses per second, 0.728 ms CPU per response, 10.6 MiB peak RSS. React on the 1,000-row table: 121 responses per second, 8.405 ms CPU per response, 162.8 MiB peak RSS. Marko on the 1,000-row table: 442 responses per second, 2.303 ms CPU per response, 120.4 MiB peak RSS. Go html/template on the 1,000-row table: 62 responses per second, 16.272 ms CPU per response, 17.1 MiB peak RSS. SvelteKit on the 1,000-row table: 174 responses per second, 5.854 ms CPU per response, 592.2 MiB peak RSS.</desc>
