<svg xmlns="http://www.w3.org/2000/svg" width="980" height="397" viewBox="0 0 980 397" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Linked showcase corpus render latency</title>
<desc id="dsc">Airbnb home: P50 11.3 µs (95% CI 11.2 µs to 11.3 µs), pooled P95 11.9 µs, 162,883 bytes, 50,000 recorded renders, raw bytes stable. Airbnb search: P50 2.88 µs (95% CI 2.88 µs to 2.92 µs), pooled P95 3.04 µs, 49,996 bytes, 50,000 recorded renders, raw bytes stable. Airbnb listing: P50 16.8 µs (95% CI 16.6 µs to 20.3 µs), pooled P95 21.5 µs, 96,250 bytes, 50,000 recorded renders, raw bytes not stable. Nike catalog: P50 18 µs (95% CI 17.8 µs to 18 µs), pooled P95 19.3 µs, 128,294 bytes, 50,000 recorded renders, raw bytes stable. Nike product: P50 4.54 µs (95% CI 4.54 µs to 5.42 µs), pooled P95 5.88 µs, 59,042 bytes, 50,000 recorded renders, raw bytes stable. eBay cards: P50 24.9 µs (95% CI 24.8 µs to 25 µs), pooled P95 27 µs, 239,235 bytes, 50,000 recorded renders, raw bytes stable. eBay chrome: P50 40.4 µs (95% CI 40.3 µs to 41.6 µs), pooled P95 45 µs, 521,326 bytes, 50,000 recorded renders, raw bytes stable. eBay real chrome: P50 51 µs (95% CI 50.8 µs to 51 µs), pooled P95 55.9 µs, 793,226 bytes, 50,000 recorded renders, raw bytes stable. ESPN game page: P50 8.21 µs (95% CI 8.17 µs to 8.25 µs), pooled P95 8.58 µs, 33,765 bytes, 50,000 recorded renders, raw bytes stable. Sentry OTel, 400 rows: P50 116 µs (95% CI 114 µs to 119 µs), pooled P95 127 µs, 875,478 bytes, 1,500 recorded renders, raw bytes stable. Settings console: P50 3 µs (95% CI 2.96 µs to 3.04 µs), pooled P95 3.21 µs, 7,925 bytes, 50,000 recorded renders, raw bytes stable.</desc>
