<svg xmlns="http://www.w3.org/2000/svg" width="980" height="397" viewBox="0 0 980 397" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Linked showcase corpus render latency</title>
<desc id="dsc">Airbnb home: P50 11 µs (95% CI 11 µs to 11.1 µs), pooled P95 11.6 µs, 162,883 bytes, 50,000 recorded renders, raw bytes stable. Airbnb search: P50 2.75 µs (95% CI 2.75 µs to 2.79 µs), pooled P95 2.96 µs, 49,996 bytes, 50,000 recorded renders, raw bytes stable. Airbnb listing: P50 16.3 µs (95% CI 16.1 µs to 16.3 µs), pooled P95 17 µs, 96,250 bytes, 50,000 recorded renders, raw bytes not stable. Nike catalog: P50 16.2 µs (95% CI 16 µs to 16.5 µs), pooled P95 17.2 µs, 128,294 bytes, 50,000 recorded renders, raw bytes stable. Nike product: P50 4.25 µs (95% CI 4.25 µs to 5.08 µs), pooled P95 5.83 µs, 59,042 bytes, 50,000 recorded renders, raw bytes stable. eBay cards: P50 23 µs (95% CI 22.9 µs to 23 µs), pooled P95 25.2 µs, 239,235 bytes, 50,000 recorded renders, raw bytes stable. eBay chrome: P50 38 µs (95% CI 37.8 µs to 38 µs), pooled P95 41 µs, 521,326 bytes, 50,000 recorded renders, raw bytes stable. eBay real chrome: P50 48.9 µs (95% CI 48.8 µs to 49 µs), pooled P95 53.8 µs, 793,226 bytes, 50,000 recorded renders, raw bytes stable. ESPN game page: P50 7.5 µs (95% CI 7.46 µs to 7.54 µs), pooled P95 7.88 µs, 33,765 bytes, 50,000 recorded renders, raw bytes stable. Sentry OTel, 400 rows: P50 100 µs (95% CI 98.5 µs to 101 µs), pooled P95 107 µs, 875,478 bytes, 1,500 recorded renders, raw bytes stable. Settings console: P50 2.96 µs (95% CI 2.92 µs to 2.96 µs), pooled P95 3.13 µs, 7,925 bytes, 50,000 recorded renders, raw bytes stable.</desc>
