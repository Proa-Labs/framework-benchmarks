<svg xmlns="http://www.w3.org/2000/svg" width="980" height="285" viewBox="0 0 980 285" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Cold start to first product-grid response for Proa, React, Marko, Go html/template and SvelteKit</title>
<desc id="dsc">Wall time includes process creation, runtime and module loading, fixture construction and the first render. Fifteen fresh processes per engine on one host. Proa: 7.38 ms median, 10.8 ms P95, 12.7 ms slowest, 6.3 MiB after the first response. React: 54.7 ms median, 60.9 ms P95, 61.7 ms slowest, 57.8 MiB after the first response. Marko: 39.6 ms median, 42 ms P95, 43.3 ms slowest, 39.9 MiB after the first response. Go html/template: 10.6 ms median, 12.1 ms P95, 13.1 ms slowest, 9.9 MiB after the first response. SvelteKit: 59.7 ms median, 63.3 ms P95, 63.4 ms slowest, 51.2 MiB after the first response.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .t   { font-size: 17px; font-weight: 600; fill: #0b0b0b; letter-spacing: -.005em; }
  .d   { font-size: 12.5px; font-weight: 400; fill: #52514e; }
  .eb  { font-size: 10.5px; font-weight: 600; fill: #898781; letter-spacing: .09em; }
  .cat { font-size: 12px; font-weight: 400; fill: #52514e; }
  .catb{ font-size: 12px; font-weight: 600; fill: #0b0b0b; }
  .lg  { font-size: 12px; font-weight: 400; fill: #52514e; }
  .tick{ font-size: 10.5px; font-weight: 400; fill: #898781; font-variant-numeric: tabular-nums; }
  .val { font-size: 11px; font-weight: 500; fill: #52514e; font-variant-numeric: tabular-nums;
         paint-order: stroke; stroke: #fcfcfb; stroke-width: 3.5px; stroke-linejoin: round; }
  .valb{ font-size: 11px; font-weight: 600; fill: #0b0b0b; font-variant-numeric: tabular-nums;
         paint-order: stroke; stroke: #fcfcfb; stroke-width: 3.5px; stroke-linejoin: round; }
  .valw{ font-size: 11px; font-weight: 600; fill: #fcfcfb; font-variant-numeric: tabular-nums; }
  .note{ font-size: 10px; font-weight: 400; fill: #898781; }
  .mono{ font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .end { text-anchor: end; }
  .mid { text-anchor: middle; }
</style>
<rect width="980" height="285" fill="#fcfcfb"/>
