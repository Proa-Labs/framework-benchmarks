[package]
name = "framework-ssr-proa"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
proa_core = { git = "https://github.com/Proa-Labs/proa", branch = "main" }
proa_macros = { git = "https://github.com/Proa-Labs/proa", branch = "main" }
proa_framework_axum = { git = "https://github.com/Proa-Labs/proa", branch = "main" }
proa_bench = { path = "../../../rendering", features = ["http-load"] }
axum = "0.7"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
