<title id="ttl">Server-render latency relative to Proa — November 14, 2026 canonical capture</title>
<desc id="dsc">Renderer-only latency, excluding HTTP and hydration. Proa returns fresh owned RenderBuffer pages without String conversion; peers retain their owned String outputs. Each dot is the median of five process P50s on a logarithmic axis. Strict rows pass DOM parity; Exact uses an explicitly adapted content/style gate. 21 renderers across three workloads as a multiple of Proa's P50. Proa — Component page: 1 µs, 1×; 1,000-row table: 250 µs, 1×; Product grid: 13 µs, 1×. Marko — Component page: 10 µs, 9.24×; 1,000-row table: 1.5 ms, 5.98×; Product grid: 110 µs, 8.93×. React — Component page: 87 µs, 78.2×; 1,000-row table: 10.1 ms, 40.3×; Product grid: 450 µs, 36.1×. Vue — Component page: 10 µs, 9.18×; 1,000-row table: 1.63 ms, 6.51×; Product grid: 94 µs, 7.49×. Svelte — Component page: 9 µs, 8.41×; 1,000-row table: 1.6 ms, 6.36×; Product grid: 96 µs, 7.64×. Rails — Component page: 80 µs, 71.9×; 1,000-row table: 9.06 ms, 36.1×; Product grid: 480 µs, 38.5×. jte — Component page: 17 µs, 15.6×; 1,000-row table: 6.95 ms, 27.7×; Product grid: 640 µs, 50.6×. Rocker — Component page: 37 µs, 33.2×; 1,000-row table: 10.1 ms, 40.1×; Product grid: 810 µs, 64.1×. Handlebars — Component page: 26 µs, 23.8×; 1,000-row table: 4.18 ms, 16.6×; Product grid: 210 µs, 17×. Go html/template — Component page: 140 µs, 129×; 1,000-row table: 14.3 ms, 56.8×; Product grid: 1.16 ms, 92.2×. Jinja2 — Component page: 110 µs, 96.7×; 1,000-row table: 19.2 ms, 76.5×; Product grid: 1.47 ms, 117×. PHP — Component page: 34 µs, 30.4×; 1,000-row table: 1.78 ms, 7.11×; Product grid: 98 µs, 7.81×. Askama — Component page: 1 µs, 1.11×; 1,000-row table: 750 µs, 3.01×; Product grid: 24 µs, 1.94×. Sailfish — Component page: 2 µs, 1.72×; 1,000-row table: 620 µs, 2.45×; Product grid: 24 µs, 1.89×. Leptos — Component page: 19 µs, 16.7×; 1,000-row table: 1.81 ms, 7.21×; Product grid: 270 µs, 21.4×. Dioxus — Component page: 170 µs, 149×; 1,000-row table: 3.48 ms, 13.9×; Product grid: 420 µs, 33.6×. Topcoat — Component page: 16 µs, 14.6×; 1,000-row table: 1.45 ms, 5.79×; Product grid: 200 µs, 15.7×. Astro — Component page: 51 µs, 46.1×; 1,000-row table: 3 ms, 11.9×; Product grid: 300 µs, 23.7×. SvelteKit — Component page: 12 µs, 10.7×; 1,000-row table: 1.58 ms, 6.29×; Product grid: 93 µs, 7.43×. Next.js — Component page: 75 µs, 68×; 1,000-row table: 5.24 ms, 20.9×; Product grid: 440 µs, 34.8×. Exact† — Component page: 5.59 ms, 5039×; 1,000-row table: 149 ms, 596×; Product grid: 17.5 ms, 1391×.</desc>
