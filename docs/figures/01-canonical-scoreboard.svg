<title id="ttl">Server-render latency relative to Proa — November 25, 2026 canonical capture</title>
<desc id="dsc">Renderer-only latency, excluding HTTP and hydration. Proa returns fresh owned RenderBuffer pages without String conversion; peers retain their owned String outputs. Each dot is the median of five process P50s on a logarithmic axis. Strict rows pass DOM parity; Exact uses an explicitly adapted content/style gate. 21 renderers across three workloads as a multiple of Proa's P50. Proa — Component page: 1 µs, 1×; 1,000-row table: 190 µs, 1×; Product grid: 10 µs, 1×. Marko — Component page: 10 µs, 10.5×; 1,000-row table: 1.5 ms, 7.89×; Product grid: 120 µs, 11.5×. React — Component page: 88 µs, 89.6×; 1,000-row table: 10.1 ms, 53.4×; Product grid: 450 µs, 44×. Vue — Component page: 10 µs, 9.86×; 1,000-row table: 1.64 ms, 8.63×; Product grid: 94 µs, 9.29×. Svelte — Component page: 9 µs, 9.28×; 1,000-row table: 1.52 ms, 8.01×; Product grid: 99 µs, 9.78×. Rails — Component page: 81 µs, 82.5×; 1,000-row table: 9.23 ms, 48.6×; Product grid: 490 µs, 48.6×. jte — Component page: 16 µs, 16.4×; 1,000-row table: 6.81 ms, 35.9×; Product grid: 640 µs, 62.8×. Rocker — Component page: 37 µs, 37.6×; 1,000-row table: 10.8 ms, 56.9×; Product grid: 780 µs, 76.7×. Handlebars — Component page: 32 µs, 32.4×; 1,000-row table: 4.24 ms, 22.3×; Product grid: 220 µs, 21.7×. Go html/template — Component page: 140 µs, 144×; 1,000-row table: 14.3 ms, 75.4×; Product grid: 1.17 ms, 116×. Jinja2 — Component page: 110 µs, 111×; 1,000-row table: 19.6 ms, 103×; Product grid: 1.44 ms, 142×. PHP — Component page: 34 µs, 34.3×; 1,000-row table: 1.82 ms, 9.57×; Product grid: 99 µs, 9.74×. Askama — Component page: 1 µs, 1.29×; 1,000-row table: 740 µs, 3.9×; Product grid: 25 µs, 2.42×. Sailfish — Component page: 2 µs, 1.89×; 1,000-row table: 650 µs, 3.4×; Product grid: 24 µs, 2.38×. Leptos — Component page: 19 µs, 19.4×; 1,000-row table: 1.69 ms, 8.93×; Product grid: 220 µs, 21.9×. Dioxus — Component page: 170 µs, 168×; 1,000-row table: 3.56 ms, 18.8×; Product grid: 440 µs, 43×. Topcoat — Component page: 16 µs, 16.3×; 1,000-row table: 1.48 ms, 7.78×; Product grid: 200 µs, 19.3×. Astro — Component page: 51 µs, 51.7×; 1,000-row table: 3.03 ms, 16×; Product grid: 300 µs, 29.7×. SvelteKit — Component page: 12 µs, 11.8×; 1,000-row table: 1.61 ms, 8.49×; Product grid: 94 µs, 9.3×. Next.js — Component page: 77 µs, 78×; 1,000-row table: 5.41 ms, 28.5×; Product grid: 450 µs, 44.7×. Exact† — Component page: 5.63 ms, 5726×; 1,000-row table: 153 ms, 808×; Product grid: 17.6 ms, 1736×.</desc>
