<title id="ttl">Server-render latency relative to Proa — November 15, 2026 canonical capture</title>
<desc id="dsc">Renderer-only latency, excluding HTTP and hydration. Proa returns fresh owned RenderBuffer pages without String conversion; peers retain their owned String outputs. Each dot is the median of five process P50s on a logarithmic axis. Strict rows pass DOM parity; Exact uses an explicitly adapted content/style gate. 21 renderers across three workloads as a multiple of Proa's P50. Proa — Component page: 1 µs, 1×; 1,000-row table: 180 µs, 1×; Product grid: 10 µs, 1×. Marko — Component page: 10 µs, 10.7×; 1,000-row table: 1.44 ms, 7.91×; Product grid: 110 µs, 11.5×. React — Component page: 87 µs, 90.2×; 1,000-row table: 10.4 ms, 57.1×; Product grid: 440 µs, 44.5×. Vue — Component page: 10 µs, 9.95×; 1,000-row table: 1.61 ms, 8.84×; Product grid: 94 µs, 9.48×. Svelte — Component page: 9 µs, 9.28×; 1,000-row table: 1.66 ms, 9.13×; Product grid: 94 µs, 9.47×. Rails — Component page: 78 µs, 80.9×; 1,000-row table: 9.12 ms, 50.1×; Product grid: 460 µs, 46×. jte — Component page: 15 µs, 15.2×; 1,000-row table: 6.8 ms, 37.3×; Product grid: 630 µs, 63.6×. Rocker — Component page: 36 µs, 37.5×; 1,000-row table: 10.7 ms, 58.5×; Product grid: 760 µs, 76.6×. Handlebars — Component page: 29 µs, 29.5×; 1,000-row table: 4.21 ms, 23.1×; Product grid: 250 µs, 24.8×. Go html/template — Component page: 140 µs, 146×; 1,000-row table: 14.2 ms, 78×; Product grid: 1.16 ms, 116×. Jinja2 — Component page: 110 µs, 109×; 1,000-row table: 19.2 ms, 106×; Product grid: 1.42 ms, 143×. PHP — Component page: 33 µs, 34.1×; 1,000-row table: 1.77 ms, 9.73×; Product grid: 95 µs, 9.51×. Askama — Component page: 1 µs, 1.27×; 1,000-row table: 730 µs, 4.01×; Product grid: 24 µs, 2.37×. Sailfish — Component page: 2 µs, 1.93×; 1,000-row table: 610 µs, 3.35×; Product grid: 23 µs, 2.31×. Leptos — Component page: 18 µs, 18.5×; 1,000-row table: 1.67 ms, 9.18×; Product grid: 210 µs, 21.3×. Dioxus — Component page: 160 µs, 168×; 1,000-row table: 3.49 ms, 19.2×; Product grid: 410 µs, 41.2×. Topcoat — Component page: 16 µs, 16.8×; 1,000-row table: 1.46 ms, 8.03×; Product grid: 200 µs, 19.8×. Astro — Component page: 50 µs, 52×; 1,000-row table: 2.85 ms, 15.6×; Product grid: 290 µs, 29.2×. SvelteKit — Component page: 11 µs, 11.7×; 1,000-row table: 1.6 ms, 8.78×; Product grid: 93 µs, 9.29×. Next.js — Component page: 75 µs, 77.8×; 1,000-row table: 5.25 ms, 28.8×; Product grid: 420 µs, 42.7×. Exact† — Component page: 5.58 ms, 5761×; 1,000-row table: 150 ms, 821×; Product grid: 17.5 ms, 1758×.</desc>
