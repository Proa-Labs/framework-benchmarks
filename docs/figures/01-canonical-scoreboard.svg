<title id="ttl">Server-render latency relative to Proa — November 15, 2026 canonical capture</title>
<desc id="dsc">Renderer-only latency, excluding HTTP and hydration. Proa returns fresh owned RenderBuffer pages without String conversion; peers retain their owned String outputs. Each dot is the median of five process P50s on a logarithmic axis. Strict rows pass DOM parity; Exact uses an explicitly adapted content/style gate. 21 renderers across three workloads as a multiple of Proa's P50. Proa — Component page: 1 µs, 1×; 1,000-row table: 240 µs, 1×; Product grid: 13 µs, 1×. Marko — Component page: 10 µs, 9.54×; 1,000-row table: 1.41 ms, 5.81×; Product grid: 110 µs, 8.64×. React — Component page: 82 µs, 75.2×; 1,000-row table: 9.15 ms, 37.8×; Product grid: 440 µs, 33.5×. Vue — Component page: 10 µs, 9×; 1,000-row table: 1.56 ms, 6.45×; Product grid: 93 µs, 7.14×. Svelte — Component page: 9 µs, 7.97×; 1,000-row table: 1.49 ms, 6.16×; Product grid: 91 µs, 7×. Rails — Component page: 76 µs, 69.7×; 1,000-row table: 9 ms, 37.1×; Product grid: 460 µs, 35.1×. jte — Component page: 21 µs, 19.3×; 1,000-row table: 6.66 ms, 27.5×; Product grid: 630 µs, 48.3×. Rocker — Component page: 36 µs, 32.6×; 1,000-row table: 8.29 ms, 34.2×; Product grid: 760 µs, 58.5×. Handlebars — Component page: 32 µs, 28.8×; 1,000-row table: 4.07 ms, 16.8×; Product grid: 210 µs, 16×. Go html/template — Component page: 140 µs, 128×; 1,000-row table: 14.2 ms, 58.4×; Product grid: 1.15 ms, 88.8×. Jinja2 — Component page: 110 µs, 96.8×; 1,000-row table: 19.2 ms, 79.2×; Product grid: 1.42 ms, 110×. PHP — Component page: 33 µs, 30.2×; 1,000-row table: 1.77 ms, 7.31×; Product grid: 94 µs, 7.26×. Askama — Component page: 1 µs, 1.11×; 1,000-row table: 740 µs, 3.05×; Product grid: 24 µs, 1.84×. Sailfish — Component page: 2 µs, 1.73×; 1,000-row table: 640 µs, 2.62×; Product grid: 24 µs, 1.82×. Leptos — Component page: 17 µs, 15.8×; 1,000-row table: 1.72 ms, 7.09×; Product grid: 260 µs, 19.8×. Dioxus — Component page: 170 µs, 151×; 1,000-row table: 3.43 ms, 14.1×; Product grid: 420 µs, 32.2×. Topcoat — Component page: 16 µs, 14.6×; 1,000-row table: 1.47 ms, 6.05×; Product grid: 190 µs, 14.8×. Astro — Component page: 49 µs, 44.8×; 1,000-row table: 2.94 ms, 12.1×; Product grid: 280 µs, 21.8×. SvelteKit — Component page: 12 µs, 10.6×; 1,000-row table: 1.66 ms, 6.85×; Product grid: 89 µs, 6.89×. Next.js — Component page: 75 µs, 68.8×; 1,000-row table: 4.9 ms, 20.2×; Product grid: 410 µs, 31.4×. Exact† — Component page: 5.48 ms, 5004×; 1,000-row table: 147 ms, 608×; Product grid: 17.2 ms, 1324×.</desc>
