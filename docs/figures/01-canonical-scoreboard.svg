<title id="ttl">Server-render latency relative to Proa — November 15, 2026 canonical capture</title>
<desc id="dsc">Renderer-only latency, excluding HTTP and hydration. Proa returns fresh owned RenderBuffer pages without String conversion; peers retain their owned String outputs. Each dot is the median of five process P50s on a logarithmic axis. Strict rows pass DOM parity; Exact uses an explicitly adapted content/style gate. 21 renderers across three workloads as a multiple of Proa's P50. Proa — Component page: 1 µs, 1×; 1,000-row table: 190 µs, 1×; Product grid: 10 µs, 1×. Marko — Component page: 10 µs, 10.3×; 1,000-row table: 1.44 ms, 7.72×; Product grid: 110 µs, 11.5×. React — Component page: 85 µs, 86.4×; 1,000-row table: 9.89 ms, 53.1×; Product grid: 440 µs, 43.8×. Vue — Component page: 10 µs, 10.4×; 1,000-row table: 1.62 ms, 8.67×; Product grid: 94 µs, 9.42×. Svelte — Component page: 9 µs, 9.24×; 1,000-row table: 1.54 ms, 8.28×; Product grid: 94 µs, 9.42×. Rails — Component page: 79 µs, 79.9×; 1,000-row table: 9.21 ms, 49.4×; Product grid: 490 µs, 48.5×. jte — Component page: 14 µs, 14.5×; 1,000-row table: 7.25 ms, 38.9×; Product grid: 640 µs, 63.6×. Rocker — Component page: 37 µs, 37.2×; 1,000-row table: 10.5 ms, 56.4×; Product grid: 800 µs, 80.2×. Handlebars — Component page: 30 µs, 30.6×; 1,000-row table: 4.2 ms, 22.5×; Product grid: 210 µs, 21.1×. Go html/template — Component page: 140 µs, 145×; 1,000-row table: 14.5 ms, 77.8×; Product grid: 1.15 ms, 115×. Jinja2 — Component page: 110 µs, 109×; 1,000-row table: 19.4 ms, 104×; Product grid: 1.42 ms, 142×. PHP — Component page: 34 µs, 34.2×; 1,000-row table: 1.82 ms, 9.76×; Product grid: 96 µs, 9.57×. Askama — Component page: 1 µs, 1.27×; 1,000-row table: 740 µs, 3.99×; Product grid: 24 µs, 2.35×. Sailfish — Component page: 2 µs, 1.92×; 1,000-row table: 620 µs, 3.35×; Product grid: 23 µs, 2.3×. Leptos — Component page: 18 µs, 18.5×; 1,000-row table: 1.69 ms, 9.08×; Product grid: 210 µs, 21.1×. Dioxus — Component page: 170 µs, 169×; 1,000-row table: 3.49 ms, 18.7×; Product grid: 410 µs, 40.6×. Topcoat — Component page: 17 µs, 16.9×; 1,000-row table: 1.5 ms, 8.06×; Product grid: 200 µs, 19.6×. Astro — Component page: 51 µs, 51.9×; 1,000-row table: 3.12 ms, 16.8×; Product grid: 300 µs, 29.6×. SvelteKit — Component page: 12 µs, 12.1×; 1,000-row table: 1.59 ms, 8.56×; Product grid: 92 µs, 9.18×. Next.js — Component page: 77 µs, 78.2×; 1,000-row table: 5.11 ms, 27.4×; Product grid: 430 µs, 42.9×. Exact† — Component page: 5.61 ms, 5685×; 1,000-row table: 149 ms, 799×; Product grid: 17.5 ms, 1750×.</desc>
