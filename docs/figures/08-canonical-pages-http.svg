<title id="ttl">Proa, React, Marko, Go html/template and SvelteKit serving the canonical pages over HTTP on one core</title>
<desc id="dsc">One core per engine, uncompressed loopback HTTP/1.1. Medians of three fresh processes; CPU counts all server threads. Proa on the Component page: 87,579 responses per second, 0.011 ms CPU per response, 8.7 MiB peak RSS. React on the Component page: 6,061 responses per second, 0.173 ms CPU per response, 96.1 MiB peak RSS. Marko on the Component page: 30,148 responses per second, 0.035 ms CPU per response, 88.1 MiB peak RSS. Go html/template on the Component page: 5,093 responses per second, 0.196 ms CPU per response, 16.2 MiB peak RSS. SvelteKit on the Component page: 5,394 responses per second, 0.201 ms CPU per response, 112.5 MiB peak RSS. Proa on the Product grid: 16,428 responses per second, 0.061 ms CPU per response, 9.2 MiB peak RSS. React on the Product grid: 1,261 responses per second, 0.816 ms CPU per response, 112.0 MiB peak RSS. Marko on the Product grid: 4,111 responses per second, 0.249 ms CPU per response, 116.1 MiB peak RSS. Go html/template on the Product grid: 736 responses per second, 1.357 ms CPU per response, 15.7 MiB peak RSS. SvelteKit on the Product grid: 1,042 responses per second, 1.010 ms CPU per response, 300.2 MiB peak RSS. Proa on the 1,000-row table: 2,552 responses per second, 0.392 ms CPU per response, 10.5 MiB peak RSS. React on the 1,000-row table: 116 responses per second, 8.674 ms CPU per response, 160.1 MiB peak RSS. Marko on the 1,000-row table: 422 responses per second, 2.409 ms CPU per response, 118.5 MiB peak RSS. Go html/template on the 1,000-row table: 62 responses per second, 16.590 ms CPU per response, 16.5 MiB peak RSS. SvelteKit on the 1,000-row table: 162 responses per second, 6.332 ms CPU per response, 588.9 MiB peak RSS.</desc>
