<title id="ttl">Proa, React, Marko, Go html/template and SvelteKit serving the canonical pages over HTTP on one core</title>
<desc id="dsc">One core per engine, uncompressed loopback HTTP/1.1. Medians of three fresh processes; CPU counts all server threads. Proa on the Component page: 92,508 responses per second, 0.011 ms CPU per response, 8.7 MiB peak RSS. React on the Component page: 6,432 responses per second, 0.162 ms CPU per response, 99.9 MiB peak RSS. Marko on the Component page: 31,964 responses per second, 0.033 ms CPU per response, 89.3 MiB peak RSS. Go html/template on the Component page: 5,377 responses per second, 0.186 ms CPU per response, 16.2 MiB peak RSS. SvelteKit on the Component page: 5,950 responses per second, 0.182 ms CPU per response, 116.6 MiB peak RSS. Proa on the Product grid: 16,877 responses per second, 0.059 ms CPU per response, 9.2 MiB peak RSS. React on the Product grid: 1,307 responses per second, 0.790 ms CPU per response, 116.7 MiB peak RSS. Marko on the Product grid: 4,267 responses per second, 0.239 ms CPU per response, 111.3 MiB peak RSS. Go html/template on the Product grid: 747 responses per second, 1.339 ms CPU per response, 15.7 MiB peak RSS. SvelteKit on the Product grid: 1,078 responses per second, 0.974 ms CPU per response, 310.1 MiB peak RSS. Proa on the 1,000-row table: 2,649 responses per second, 0.377 ms CPU per response, 10.5 MiB peak RSS. React on the 1,000-row table: 120 responses per second, 8.328 ms CPU per response, 161.4 MiB peak RSS. Marko on the 1,000-row table: 437 responses per second, 2.344 ms CPU per response, 118.8 MiB peak RSS. Go html/template on the 1,000-row table: 62 responses per second, 16.443 ms CPU per response, 16.4 MiB peak RSS. SvelteKit on the 1,000-row table: 173 responses per second, 5.949 ms CPU per response, 601.5 MiB peak RSS.</desc>
