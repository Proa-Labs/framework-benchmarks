<title id="ttl">Proa, React, Marko, Go html/template and SvelteKit serving the canonical pages over HTTP on one core</title>
<desc id="dsc">One core per engine, uncompressed loopback HTTP/1.1. Medians of three fresh processes; CPU counts all server threads. Proa on the Component page: 93,176 responses per second, 0.011 ms CPU per response, 8.7 MiB peak RSS. React on the Component page: 6,718 responses per second, 0.155 ms CPU per response, 99.6 MiB peak RSS. Marko on the Component page: 33,112 responses per second, 0.032 ms CPU per response, 88.7 MiB peak RSS. Go html/template on the Component page: 5,521 responses per second, 0.181 ms CPU per response, 16.2 MiB peak RSS. SvelteKit on the Component page: 6,433 responses per second, 0.168 ms CPU per response, 114.5 MiB peak RSS. Proa on the Product grid: 16,593 responses per second, 0.064 ms CPU per response, 9.1 MiB peak RSS. React on the Product grid: 1,383 responses per second, 0.744 ms CPU per response, 118.0 MiB peak RSS. Marko on the Product grid: 4,527 responses per second, 0.225 ms CPU per response, 118.5 MiB peak RSS. Go html/template on the Product grid: 773 responses per second, 1.294 ms CPU per response, 15.7 MiB peak RSS. SvelteKit on the Product grid: 1,169 responses per second, 0.897 ms CPU per response, 314.5 MiB peak RSS. Proa on the 1,000-row table: 1,773 responses per second, 0.594 ms CPU per response, 10.6 MiB peak RSS. React on the 1,000-row table: 131 responses per second, 7.740 ms CPU per response, 171.7 MiB peak RSS. Marko on the 1,000-row table: 456 responses per second, 2.234 ms CPU per response, 119.7 MiB peak RSS. Go html/template on the 1,000-row table: 63 responses per second, 15.923 ms CPU per response, 16.6 MiB peak RSS. SvelteKit on the 1,000-row table: 185 responses per second, 5.564 ms CPU per response, 696.7 MiB peak RSS.</desc>
