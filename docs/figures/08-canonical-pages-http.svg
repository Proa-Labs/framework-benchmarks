<title id="ttl">Proa, React, Marko, Go html/template and SvelteKit serving the canonical pages over HTTP on one core</title>
<desc id="dsc">One core per engine, uncompressed loopback HTTP/1.1. Medians of three fresh processes; CPU counts all server threads. Proa on the Component page: 91,742 responses per second, 0.011 ms CPU per response, 8.6 MiB peak RSS. React on the Component page: 6,609 responses per second, 0.158 ms CPU per response, 96.5 MiB peak RSS. Marko on the Component page: 32,092 responses per second, 0.033 ms CPU per response, 87.3 MiB peak RSS. Go html/template on the Component page: 5,482 responses per second, 0.182 ms CPU per response, 16.3 MiB peak RSS. SvelteKit on the Component page: 6,333 responses per second, 0.171 ms CPU per response, 116.8 MiB peak RSS. Proa on the Product grid: 16,400 responses per second, 0.065 ms CPU per response, 9.1 MiB peak RSS. React on the Product grid: 1,353 responses per second, 0.758 ms CPU per response, 112.1 MiB peak RSS. Marko on the Product grid: 4,386 responses per second, 0.232 ms CPU per response, 119.2 MiB peak RSS. Go html/template on the Product grid: 771 responses per second, 1.299 ms CPU per response, 15.7 MiB peak RSS. SvelteKit on the Product grid: 1,168 responses per second, 0.903 ms CPU per response, 285.9 MiB peak RSS. Proa on the 1,000-row table: 1,732 responses per second, 0.607 ms CPU per response, 10.5 MiB peak RSS. React on the 1,000-row table: 125 responses per second, 8.045 ms CPU per response, 162.6 MiB peak RSS. Marko on the 1,000-row table: 449 responses per second, 2.275 ms CPU per response, 115.7 MiB peak RSS. Go html/template on the 1,000-row table: 64 responses per second, 15.933 ms CPU per response, 16.5 MiB peak RSS. SvelteKit on the 1,000-row table: 179 responses per second, 5.757 ms CPU per response, 636.0 MiB peak RSS.</desc>
