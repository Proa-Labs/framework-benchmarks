[package]
name = "framework-ssr-leptos"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
axum = "0.7"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
leptos = { version = "=0.7.8", features = ["ssr"] }
leptos_axum = "=0.7.8"
libc = "0.2"
proa_bench = { path = "../../../rendering" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt"] }
